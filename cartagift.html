<script>
	// invitados: id = clave usada en USERS (inicio.html), display = texto de "Para:"
	const DEFAULT = {
		titulo1: "Un montón de cosas lindas", texto1: "Escribí acá la primera dedicatoria.", foto1: "",
		titulo2: "Y un poco más", texto2: "Escribí acá la segunda dedicatoria.", foto2: "",
		detalle1: "Escribí acá la viñeta 1.", detalle2: "Escribí acá la viñeta 2.", detalle3: "Escribí acá la viñeta 3.",
	};

	const CONTENIDOS = {
		pablo:    { titulo1: "LOS QUIERO UN MONTÓN HDP", texto1: "Escribí acá la dedicatoria para Pablo.", foto1: "img/cabros/all.jpeg", titulo2: "Y van muchos años más", texto2: "Escribí acá la segunda parte.", foto2: "", detalle1: "Escribí acá la viñeta 1 de Pablo.", detalle2: "Escribí acá la viñeta 2 de Pablo.", detalle3: "Escribí acá la viñeta 3 de Pablo." },
		caro:     { ...DEFAULT },
		lucas:    { ...DEFAULT },
		maxi:     { ...DEFAULT },
		julian:   { ...DEFAULT },
		ismael:   { ...DEFAULT },
		nicolas:  { ...DEFAULT },
		daneri:   { ...DEFAULT },
		armengol: { ...DEFAULT },
		valeria:  { ...DEFAULT },
		cabros:   { titulo1: "Muy Feliz Día del Amigo!!", texto1: "Me alega tenerlos a todos ustedes como amigos, son muy buena compañía, son chistosos, son auténticos y un muy lindo grupo todos estos años (y espero que más). Son todos diferentes y tienen sus particularidades, como algunos más tranquilos otros más bulliciosos, otros más enojones o los timberos de mrd que juegan al Poker conmigo JAJA", foto1: "img/cabros/all.jpg" , titulo2: "LOS  QUIERO UN MONTÓN CABROSSS", texto2: "Manga de geis: Los valoro mucho, gracias por todas las sonrisas que me sacan con sus giladas sobretodo cuando estoy mal. Intento siempre estar para ustedes cuando necesiten, esten mal o bien, intento estar a pesar de ser una amistad media ausente KJASKJSA		|| Posdata: Sorry por hacerlos esperar x su regalo (sorpresa), seguro me voy a atrasar en terminar y mostrarles esto. :)", foto2: "img/cabros/all2.jpg", detalle1: "Los quiero geis", detalle2: "Gracias X todo", detalle3: "Nunca dejen de ser geis", foto3: "img/cabros/all3.jpg", foto4: "img/cabros/all4.jpg", foto5: "img/cabros/all5.jpg", foto6: "img/cabros/all6.jpg" },
	};

	function mostrarFechaHoy() {
		const hoy = new Date();
		const dd = String(hoy.getDate()).padStart(2, '0');
		const mm = String(hoy.getMonth() + 1).padStart(2, '0');
		document.getElementById('fecha').textContent = `${dd}/${mm}/${hoy.getFullYear()}`;
	}

	function mostrarContenidoInvitado() {
		const params = new URLSearchParams(window.location.search);
		const id = sessionStorage.getItem('idInvitado') || params.get('id') || '';
		const nombre = sessionStorage.getItem('nombreInvitado') || params.get('nombre');
		if (nombre) document.getElementById('destinatario').textContent = nombre;

		const c = CONTENIDOS[id] || DEFAULT;
		document.getElementById('titulo-1').textContent = c.titulo1;
		document.getElementById('texto-1').textContent = c.texto1;
		document.getElementById('titulo-2').textContent = c.titulo2;
		document.getElementById('texto-2').textContent = c.texto2;
		if (c.foto1) document.getElementById('foto-1').style.backgroundImage = `url('${c.foto1}')`;
		if (c.foto2) document.getElementById('foto-2').style.backgroundImage = `url('${c.foto2}')`;
		if (c.foto3) document.getElementById('foto-3').style.backgroundImage = `url('${c.foto3}')`;
		if (c.foto4) document.getElementById('foto-4').style.backgroundImage = `url('${c.foto4}')`;
		if (c.foto5) document.getElementById('foto-5').style.backgroundImage = `url('${c.foto5}')`;
		if (c.foto6) document.getElementById('foto-6').style.backgroundImage = `url('${c.foto6}')`;



		document.getElementById('detalle-1').textContent = c.detalle1;
		document.getElementById('detalle-2').textContent = c.detalle2;
		document.getElementById('detalle-3').textContent = c.detalle3;
	}

	// dots fijos de navegación: uno por sección (dedicatoria, tarjetas, detalles)
	function iniciarDots() {
		const secciones = ['sec-dedicatoria', 'sec-cards', 'sec-detalles'].map(id => document.getElementById(id));
		const dotsContainer = document.getElementById('dots');

		const dots = secciones.map((seccion, i) => {
			const dot = document.createElement('div');
			dot.className = i === 0 ? 'circle-12' : 'circle-dot';
			dot.addEventListener('click', () => seccion.scrollIntoView({ behavior: 'smooth', block: 'start' }));
			dotsContainer.appendChild(dot);
			return dot;
		});

		function actualizarDotActivo() {
			const centro = window.scrollY + window.innerHeight / 2;
			const activo = secciones.reduce((masCercano, seccion, i) => {
				const distancia = Math.abs(seccion.offsetTop + seccion.offsetHeight / 2 - centro);
				const distanciaActual = Math.abs(secciones[masCercano].offsetTop + secciones[masCercano].offsetHeight / 2 - centro);
				return distancia < distanciaActual ? i : masCercano;
			}, 0);
			dots.forEach((dot, i) => dot.className = i === activo ? 'circle-12' : 'circle-dot');
		}

		let scrollTimeout;
		window.addEventListener('scroll', () => {
			clearTimeout(scrollTimeout);
			scrollTimeout = setTimeout(actualizarDotActivo, 50);
		});
		actualizarDotActivo();
	}

	mostrarFechaHoy();
	mostrarContenidoInvitado();
	iniciarDots();
</script>
